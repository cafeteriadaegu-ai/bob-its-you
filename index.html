<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bob, It's you!</title>

  <!-- 데이터를 가져올 구글 서버와 미리 연결을 맺어둬서 첫 요청 속도 개선 -->
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="dns-prefetch" href="https://docs.google.com">

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QESS83V2DE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QESS83V2DE');
  </script>

  <style>
    :root {
      --green: oklch(50% 0.13 150);
      --orange: oklch(60% 0.15 55);
      --red: oklch(55% 0.18 25);
      --gray: oklch(55% 0.01 95);
      --bg: oklch(98% 0.004 95);
      --card: #ffffff;
      --text: oklch(22% 0.015 95);
      --text-muted: oklch(55% 0.01 95);
      --border: oklch(90% 0.005 95);
      --accent: oklch(55% 0.14 255);
      --accent-hover: oklch(45% 0.14 255);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background: var(--bg);
      margin: 0;
      padding: clamp(16px, 4vw, 32px);
      padding-bottom: clamp(32px, 6vw, 56px);
      color: var(--text);
      max-width: 720px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: clamp(16px, 3vw, 32px);
    }
    .eyebrow {
      font-size: clamp(12px, 1.5vw, 14px);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    h1 {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 600;
      margin: 0;
    }
    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: clamp(20px, 3vw, 32px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: clamp(16px, 3vw, 32px);
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
      display: inline-block;
      transition: background 0.3s;
    }
    .status-dot.green { background: var(--green); }
    .status-dot.orange { background: var(--orange); }
    .status-dot.red { background: var(--red); }
    .status-dot.gray { background: var(--gray); }
    .status-text {
      font-size: clamp(18px, 2.5vw, 24px);
      font-weight: 600;
    }
    .updated {
      font-size: clamp(13px, 1.6vw, 15px);
      color: var(--text-muted);
    }
    .notice-banner {
      display: none;
      padding: clamp(12px, 2vw, 16px) 4px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: clamp(14px, 1.8vw, 16px);
      color: oklch(38% 0.02 80);
      line-height: 1.5;
      white-space: pre-line;
      margin-bottom: clamp(16px, 3vw, 32px);
    }
    .notice-banner.show {
      display: block;
    }
    .menu-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: clamp(20px, 3vw, 32px);
      margin-bottom: clamp(16px, 3vw, 32px);
    }
    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: clamp(6px, 1vw, 10px) 0;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      font-family: inherit;
      font-size: clamp(13px, 1.6vw, 16px);
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }
    .tab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tab.today {
      color: var(--text);
      font-weight: 700;
    }
    .tab.selected {
      color: var(--text);
      font-weight: 700;
      border-bottom-color: var(--accent);
    }
    .menu-detail {
      text-align: center;
      padding: 10px 0;
      min-height: 60px;
    }
    .menu-date {
      font-size: clamp(13px, 1.6vw, 15px);
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .menu-name {
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 600;
      white-space: pre-line;
      margin-bottom: 6px;
    }
    .menu-note {
      font-size: clamp(13px, 1.6vw, 15px);
      color: var(--text-muted);
    }
    .refresh-btn {
      display: block;
      margin: 0 auto;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: none;
      color: var(--accent);
      font-family: inherit;
      font-size: clamp(13px, 1.6vw, 15px);
      cursor: pointer;
    }
    .refresh-btn:hover {
      color: var(--accent-hover);
    }
    .refresh-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="eyebrow">오늘의 식당</div>
    <h1>Bob, It's you!</h1>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span id="statusDot" class="status-dot gray"></span>
      <span id="statusText" class="status-text">불러오는 중...</span>
    </div>
    <div class="updated" id="updatedInfo"></div>
  </div>

  <div class="notice-banner" id="noticeBanner"></div>

  <div class="menu-card">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="menu-detail" id="menuDetail">메뉴 불러오는 중...</div>
  </div>

  <button class="refresh-btn" onclick="loadStatus(); loadMenu();">새로고침</button>

  <script>
    /**
     * 데이터 소스: 구글 시트 "CSV로 다운로드" 방식 (export?format=csv)
     * Apps Script 서버를 거치지 않고 구글 문서 인프라에서 직접 CSV를 받아오므로
     * 동시접속자가 아무리 많아도 안정적으로 처리됩니다.
     * 대신 시트 수정 후 반영까지 몇 분 정도 지연될 수 있습니다.
     *
     * (gviz/tq 방식은 첫 줄을 자동으로 "제목행"으로 잘못 해석하는 문제가 있어
     *  더 단순하고 예측 가능한 export?format=csv 방식으로 변경함)
     */
    const SPREADSHEET_ID = '1D4qPtNZaiTBMuzIUYEgLfLAd35hA2jd2AezKmqggfwc';
    const MENU_GID = '199969268';
    const STATUS_GID = '2074973856';

    function csvUrl(gid) {
      return 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID +
        '/export?format=csv&gid=' + gid;
    }

    /* 간단한 CSV 파서 (따옴표로 묶인 필드 안의 쉼표/줄바꿈도 올바르게 처리) */
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (inQuotes) {
          if (char === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            row.push(field); field = '';
          } else if (char === '\r') {
            /* 무시 */
          } else if (char === '\n') {
            row.push(field); field = '';
            rows.push(row); row = [];
          } else {
            field += char;
          }
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }
      return rows.filter(r => r.length > 0 && r.some(c => c !== ''));
    }

    let menuDays = [];
    let todayIndex = -1;
    let selectedIndex = 0;

    const statusColorMap = {
      '운영중': 'green',
      '배식중지-조리중': 'orange',
      '배식중지-만석': 'red',
      '운영종료': 'gray'
    };

    async function loadStatus() {
      try {
        const res = await fetch(csvUrl(STATUS_GID), { cache: 'no-store' });
        if (!res.ok) throw new Error('네트워크 응답 오류 (' + res.status + ')');
        const rows = parseCSV(await res.text());

        /* 상태관리 시트: 1행=현재상태, 2행=대기줄위치(미사용), 3행=마지막업데이트, 4행=공지사항 (B열 값) */
        const status = (rows[0] && rows[0][1]) ? rows[0][1].trim() : '정보없음';
        const lastUpdated = (rows[2] && rows[2][1]) ? rows[2][1].trim() : '-';
        const notice = (rows[3] && rows[3][1]) ? rows[3][1].trim() : '';

        renderStatus({ status, lastUpdated, notice });
      } catch (err) {
        showStatusError(err);
      }
    }

    async function loadMenu() {
      try {
        const res = await fetch(csvUrl(MENU_GID), { cache: 'no-store' });
        if (!res.ok) throw new Error('네트워크 응답 오류 (' + res.status + ')');
        const rows = parseCSV(await res.text());

        /* 1행은 헤더(요일,날짜,메뉴,비고) - 2~6행이 월~금 데이터 */
        const dataRows = rows.slice(1, 6);
        const days = dataRows.map(r => ({
          day: r[0] || '',
          date: r[1] || '',
          menu: r[2] || '',
          note: r[3] || ''
        }));

        const now = new Date();
        const jsDay = now.getDay();
        todayIndex = (jsDay >= 1 && jsDay <= 5) ? jsDay - 1 : -1;
        menuDays = days;
        selectedIndex = todayIndex >= 0 ? todayIndex : 0;

        renderTabs();
        renderMenuDetail();
      } catch (err) {
        showMenuError(err);
      }
    }

    /* 상태 정보 로드 실패 - 상태 카드에만 표시 (메뉴 쪽 상태는 건드리지 않음) */
    function showStatusError(err) {
      console.error('상태 정보 로드 실패:', err);
      document.getElementById('statusDot').className = 'status-dot red';
      document.getElementById('statusText').textContent = '오류 발생';
      document.getElementById('updatedInfo').textContent =
        '상태 정보를 불러오지 못했습니다: ' + (err && err.message ? err.message : err);
    }

    /* 메뉴 정보 로드 실패 - 메뉴 카드에만 표시 (이미 불러온 상태는 그대로 유지) */
    function showMenuError(err) {
      console.error('메뉴 정보 로드 실패:', err);
      document.getElementById('tabs').innerHTML = '';
      document.getElementById('menuDetail').textContent =
        '메뉴 정보를 불러오지 못했습니다: ' + (err && err.message ? err.message : err);
    }

    function renderStatus(data) {
      const color = statusColorMap[data.status] || 'gray';
      document.getElementById('statusDot').className = 'status-dot ' + color;
      document.getElementById('statusText').textContent = data.status;
      document.getElementById('updatedInfo').textContent = '마지막 업데이트: ' + data.lastUpdated;

      const noticeEl = document.getElementById('noticeBanner');
      if (data.notice) {
        noticeEl.textContent = data.notice;
        noticeEl.classList.add('show');
      } else {
        noticeEl.classList.remove('show');
        noticeEl.textContent = '';
      }
    }

    function escapeHtml_(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderTabs() {
      const tabsEl = document.getElementById('tabs');
      tabsEl.innerHTML = '';
      menuDays.forEach((d, i) => {
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.textContent = d.day;
        tab.className = 'tab';
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', i === selectedIndex ? 'true' : 'false');
        if (i === todayIndex) tab.classList.add('today');
        if (i === selectedIndex) tab.classList.add('selected');
        tab.addEventListener('click', () => {
          selectedIndex = i;
          renderTabs();
          renderMenuDetail();
        });
        tabsEl.appendChild(tab);
      });
    }

    function renderMenuDetail() {
      const d = menuDays[selectedIndex];
      const el = document.getElementById('menuDetail');
      if (!d) { el.textContent = '등록된 메뉴가 없습니다.'; return; }
      el.innerHTML =
        '<div class="menu-date">' + escapeHtml_(d.date) + '</div>' +
        '<div class="menu-name">' + (d.menu ? escapeHtml_(d.menu) : '메뉴 미등록') + '</div>' +
        (d.note ? '<div class="menu-note">' + escapeHtml_(d.note) + '</div>' : '');
    }

    /* 화면을 안 보고 있을 때는 자동으로 갱신 중단 */
    let pollTimer = null;
    const POLL_INTERVAL = 10000; /* 10초 */

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(loadStatus, POLL_INTERVAL);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPolling();
      } else {
        loadStatus();
        startPolling();
      }
    });

    // 최초 로딩: 상태 + 메뉴 둘 다 즉시 조회
    loadStatus();
    loadMenu();
    startPolling();
  </script>
</body>
</html>
