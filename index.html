<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bob, It's you!</title>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QESS83V2DE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QESS83V2DE');
  </script>

  <style>
    :root {
      --green: #2e7d32;
      --orange: #ef6c00;
      --red: #c62828;
      --gray: #616161;
      --bg: #f5f6f8;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background: var(--bg);
      margin: 0;
      padding: clamp(16px, 4vw, 32px);
      color: #222;
      max-width: 720px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      font-size: clamp(20px, 3vw, 28px);
      text-align: center;
      margin-bottom: 16px;
    }
    .status-card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .status-badge {
      display: inline-block;
      padding: clamp(10px, 1.5vw, 16px) clamp(24px, 4vw, 36px);
      border-radius: 999px;
      color: #fff;
      font-weight: bold;
      font-size: clamp(18px, 2.5vw, 24px);
      margin-bottom: 10px;
      transition: background 0.3s;
    }
    .status-badge.green { background: var(--green); }
    .status-badge.orange { background: var(--orange); }
    .status-badge.red { background: var(--red); }
    .status-badge.gray { background: var(--gray); }
    .queue-info {
      font-size: clamp(20px, 2.5vw, 26px);
      font-weight: bold;
      color: #333;
      margin-top: 6px;
    }
    .updated {
      font-size: clamp(15px, 1.8vw, 18px);
      color: #999;
      margin-top: 8px;
    }
    .menu-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: clamp(8px, 1.2vw, 12px) 0;
      border-radius: 8px;
      background: #eee;
      font-size: clamp(13px, 1.6vw, 16px);
      cursor: pointer;
      color: #555;
      user-select: none;
    }
    .tab.today {
      box-shadow: inset 0 0 0 2px #1a73e8;
      color: #1a73e8;
      font-weight: bold;
    }
    .tab.selected {
      background: #1a73e8;
      color: #fff;
    }
    .tab.selected.today {
      box-shadow: none;
    }
    .menu-detail {
      text-align: center;
      padding: 10px 0;
      min-height: 60px;
    }
    .menu-date {
      font-size: clamp(15px, 1.8vw, 18px);
      color: #999;
      margin-bottom: 4px;
    }
    .menu-name {
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: bold;
      white-space: pre-line;
      margin-bottom: 6px;
    }
    .menu-note {
      font-size: clamp(13px, 1.6vw, 15px);
      color: #777;
    }
    .refresh-btn {
      display: block;
      margin: 16px auto 0;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .notice-banner {
      display: none;
      background: #fff8e1;
      border: 1px solid #ffca28;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: clamp(15px, 2vw, 18px);
      color: #7a5c00;
      margin-bottom: 16px;
      line-height: 1.5;
      white-space: pre-line;
    }
    .notice-banner.show {
      display: block;
    }
    .notice-banner strong {
      margin-right: 4px;
    }
    .footer-logo {
      text-align: center;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e5e5e5;
    }
    .footer-logo img {
      max-width: clamp(140px, 15vw, 200px);
      height: auto;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>🍽 Bob, It's you!</h1>

  <div class="notice-banner" id="noticeBanner"></div>

  <div class="status-card">
    <div id="statusBadge" class="status-badge gray">불러오는 중...</div>
    <div class="queue-info" id="queueInfo">대기줄 위치 확인 중...</div>
    <div class="updated" id="updatedInfo"></div>
  </div>

  <div class="menu-card">
    <div class="tabs" id="tabs"></div>
    <div class="menu-detail" id="menuDetail">메뉴 불러오는 중...</div>
  </div>

  <button class="refresh-btn" onclick="loadStatus(); loadMenu();">새로고침</button>

  <div class="footer-logo">
    <img src="https://lh3.googleusercontent.com/d/1ziejh-zfnA0x3g_bCoq2DWWC7dHQw_dW" alt="대구광역시 로고">
  </div>

  <script>
    /**
     * 데이터 소스: 구글 시트 "CSV로 다운로드" 방식 (export?format=csv)
     * Apps Script 서버를 거치지 않고 구글 문서 인프라에서 직접 CSV를 받아오므로
     * 동시접속자가 아무리 많아도 안정적으로 처리됩니다.
     * 대신 시트 수정 후 반영까지 몇 분 정도 지연될 수 있습니다.
     *
     * (gviz/tq 방식은 첫 줄을 자동으로 "제목행"으로 잘못 해석하는 문제가 있어
     *  더 단순하고 예측 가능한 export?format=csv 방식으로 변경함)
     */
    const SPREADSHEET_ID = '1D4qPtNZaiTBMuzIUYEgLfLAd35hA2jd2AezKmqggfwc';
    const MENU_GID = '199969268';
    const STATUS_GID = '2074973856';

    function csvUrl(gid) {
      return 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID +
        '/export?format=csv&gid=' + gid +
        '&_=' + Date.now(); /* 캐시 방지용 타임스탬프 */
    }

    /* 간단한 CSV 파서 (따옴표로 묶인 필드 안의 쉼표/줄바꿈도 올바르게 처리) */
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (inQuotes) {
          if (char === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            row.push(field); field = '';
          } else if (char === '\r') {
            /* 무시 */
          } else if (char === '\n') {
            row.push(field); field = '';
            rows.push(row); row = [];
          } else {
            field += char;
          }
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }
      return rows.filter(r => r.length > 0 && r.some(c => c !== ''));
    }

    let menuDays = [];
    let todayIndex = -1;
    let selectedIndex = 0;

    const statusColorMap = {
      '운영중': 'green',
      '이용불가-조리중': 'orange',
      '이용불가-만석': 'red',
      '운영종료': 'gray'
    };

    async function loadStatus() {
      try {
        const res = await fetch(csvUrl(STATUS_GID));
        if (!res.ok) throw new Error('네트워크 응답 오류 (' + res.status + ')');
        const rows = parseCSV(await res.text());

        /* 상태관리 시트: 1행=현재상태, 2행=대기줄위치, 3행=마지막업데이트, 4행=공지사항 (B열 값) */
        const status = (rows[0] && rows[0][1]) ? rows[0][1].trim() : '정보없음';
        const queueLocation = (rows[1] && rows[1][1]) ? rows[1][1].trim() : '안내 정보 없음';
        const lastUpdated = (rows[2] && rows[2][1]) ? rows[2][1].trim() : '-';
        const notice = (rows[3] && rows[3][1]) ? rows[3][1].trim() : '';

        renderStatus({ status, queueLocation, lastUpdated, notice });
      } catch (err) {
        showError('상태 정보', err);
      }
    }

    async function loadMenu() {
      try {
        const res = await fetch(csvUrl(MENU_GID));
        if (!res.ok) throw new Error('네트워크 응답 오류 (' + res.status + ')');
        const rows = parseCSV(await res.text());

        /* 1행은 헤더(요일,날짜,메뉴,비고) - 2~6행이 월~금 데이터 */
        const dataRows = rows.slice(1, 6);
        const days = dataRows.map(r => ({
          day: r[0] || '',
          date: r[1] || '',
          menu: r[2] || '',
          note: r[3] || ''
        }));

        const now = new Date();
        const jsDay = now.getDay();
        todayIndex = (jsDay >= 1 && jsDay <= 5) ? jsDay - 1 : -1;
        menuDays = days;
        selectedIndex = todayIndex >= 0 ? todayIndex : 0;

        renderTabs();
        renderMenuDetail();
      } catch (err) {
        showError('메뉴 정보', err);
      }
    }

    function showError(label, err) {
      console.error(label + ' 로드 실패:', err);
      const badge = document.getElementById('statusBadge');
      badge.className = 'status-badge red';
      badge.textContent = '오류 발생';
      document.getElementById('queueInfo').textContent =
        label + '를 불러오지 못했습니다: ' + (err && err.message ? err.message : err);
    }

    function renderStatus(data) {
      const badge = document.getElementById('statusBadge');
      const color = statusColorMap[data.status] || 'gray';
      badge.className = 'status-badge ' + color;
      badge.textContent = data.status;
      document.getElementById('queueInfo').textContent = '📍 대기줄 위치: ' + data.queueLocation;
      document.getElementById('updatedInfo').textContent = '마지막 업데이트: ' + data.lastUpdated;

      const noticeEl = document.getElementById('noticeBanner');
      if (data.notice) {
        noticeEl.innerHTML = '<strong>📢 공지</strong> ' + escapeHtml_(data.notice);
        noticeEl.classList.add('show');
      } else {
        noticeEl.classList.remove('show');
        noticeEl.innerHTML = '';
      }
    }

    function escapeHtml_(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderTabs() {
      const tabsEl = document.getElementById('tabs');
      tabsEl.innerHTML = '';
      menuDays.forEach((d, i) => {
        const tab = document.createElement('div');
        tab.textContent = d.day;
        tab.className = 'tab';
        if (i === todayIndex) tab.classList.add('today');
        if (i === selectedIndex) tab.classList.add('selected');
        tab.addEventListener('click', () => {
          selectedIndex = i;
          renderTabs();
          renderMenuDetail();
        });
        tabsEl.appendChild(tab);
      });
    }

    function renderMenuDetail() {
      const d = menuDays[selectedIndex];
      const el = document.getElementById('menuDetail');
      if (!d) { el.textContent = '등록된 메뉴가 없습니다.'; return; }
      el.innerHTML =
        '<div class="menu-date">' + d.day + '요일 · ' + d.date + '</div>' +
        '<div class="menu-name">' + (d.menu || '메뉴 미등록') + '</div>' +
        (d.note ? '<div class="menu-note">' + d.note + '</div>' : '');
    }

    /* 화면을 안 보고 있을 때는 자동으로 갱신 중단 */
    let pollTimer = null;
    const POLL_INTERVAL = 1000; /* 1초 */

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(loadStatus, POLL_INTERVAL);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPolling();
      } else {
        loadStatus();
        startPolling();
      }
    });

    // 최초 로딩: 상태 + 메뉴 둘 다 즉시 조회
    loadStatus();
    loadMenu();
    startPolling();
  </script>
</body>
</html>
